<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2a30">
<title>Дыхание</title>
<link rel="stylesheet" href="css/app.css?v31">
</head>
<body>
<div id="app">Загрузка…</div>
<script>
  // Ошибки логируем в консоль, но НЕ заменяем интерфейс (иначе любая мелочь стирает экран).
  window.addEventListener('error', function (e) {
    try { console.error('[app error]', e.message, e.filename, e.lineno); } catch (_) {}
  });
  window.addEventListener('unhandledrejection', function (e) {
    try { console.error('[app rejection]', e.reason); } catch (_) {}
  });
</script>
<script type="module" src="js/app.js?v31"></script>
</body>
</html>
