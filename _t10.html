<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"></head><body style="margin:0">
<pre id="r"></pre>
<script>
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
window.addEventListener('load', async () => {
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;left:0;top:0;width:480px;height:900px;border:0';
  f.src = 'index.html?s=session&p=box_4444';
  document.body.appendChild(f);
  await new Promise((r) => f.addEventListener('load', r));
  const w = f.contentWindow, d = f.contentDocument;
  await sleep(4000);
  const rect = (sel) => { const e = d.querySelector(sel); if (!e) return null; const r = e.getBoundingClientRect(); return { w: Math.round(r.width), h: Math.round(r.height), cx: Math.round(r.left + r.width / 2), cy: Math.round(r.top + r.height / 2) }; };
  const out = {
    innerW: w.innerWidth, innerH: w.innerHeight,
    docClientW: d.documentElement.clientWidth,
    bodyscrollW: d.body.scrollWidth,
    session: rect('.session'),
    app: rect('#app'),
    orbWrap: rect('.orb-wrap'),
    orb: rect('#orb'),
    orbSvg: rect('.orb-svg'),
    cycleRing: rect('.cycle-ring'),
    cycleArc: rect('#cycleArc'),
    cycleDot: rect('#cycleDot'),
    cosmos: rect('#cosmos'),
  };
  document.getElementById('r').textContent = JSON.stringify(out, null, 1);
});
</script></body></html>
